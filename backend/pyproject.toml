[project]
name = "carrier-pool-backend"
version = "0.1.0"
description = "Carrier Pool API"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi[standard]>=0.116,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "sqlalchemy>=2.0,<3",
    "typer>=0.16,<1",
]

[project.scripts]
carrier-pool = "carrier_pool.cli:main"

[dependency-groups]
analysis = [
    "pandas>=2.2,<3",
    "scikit-learn>=1.6,<2",
]
dev = [
    "httpx>=0.28,<1",
    "pyright>=1.1.400,<2",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carrier_pool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
