name: carrier-pool

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carrier_pool}
      POSTGRES_USER: ${POSTGRES_USER:-carrier_pool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carrier_pool}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-carrier_pool}:${POSTGRES_PASSWORD:-carrier_pool}@db:5432/${APP_DATABASE_NAME:-carrier_pool}
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  backend:
    build:
      context: ./backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_APP_USER:-carrier_pool_app}:${POSTGRES_APP_PASSWORD:-carrier_pool_app}@db:5432/${APP_DATABASE_NAME:-carrier_pool}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    restart: unless-stopped

  initialize:
    build:
      context: ./backend
    profiles: ["initialize"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-carrier_pool}:${POSTGRES_PASSWORD:-carrier_pool}@db:5432/${APP_DATABASE_NAME:-carrier_pool}
    volumes:
      - ./data:/data:ro
    command:
      - sh
      - -ec
      - |
        carrier-pool validate-data --data-root /data
        carrier-pool seed-demo-tenants
        carrier-pool ingest-all --data-root /data --freightflow-tenant-id 11111111-1111-4111-8111-111111111111 --hauldesk-tenant-id 22222222-2222-4222-8222-222222222222 --brokeros-tenant-id 33333333-3333-4333-8333-333333333333
        carrier-pool decide-active
    restart: "no"

volumes:
  postgres_data:
